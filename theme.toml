name = "LyteStoa"
license = "MIT"
licenselink = "https://github.com/dylanhernandez/lytestoa/blob/main/LICENSE"
description = "A fast, responsive Hugo theme purpose-built for curating, showcasing, and embedding playable HTML5 game galleries."
homepage = "https://github.com/dylanhernandez/lytestoa"
min_version = "0.158.0"

tags = [
  "games",
  "html5",
  "gallery",
  "showcase",
  "arcade",
  "minimal",
  "dark",
  "responsive"
]

features = [
  "responsive-gallery",
  "playable-stage",
  "json-ld-seo",
  "zero-dependencies"
]

[author]
  name = "Dylan Hernandez"
  homepage = "https://github.com/dylanhernandez"
