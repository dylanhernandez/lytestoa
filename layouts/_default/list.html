{{- define "main" -}}
  <section aria-labelledby="list-title">
    <h1 class="section-title" id="list-title">{{ .Title }}</h1>
    {{- with .Content }}
      <div class="list-intro">
        {{ . }}
      </div>
    {{- end }}

    {{- $pages := .Pages -}}
    {{- if gt (len $pages) 0 }}
      <div class="gallery">
        {{- range $pages }}
          {{- partial "game-card.html" . -}}
        {{- end }}
      </div>
    {{- else }}
      <p>No entries found.</p>
    {{- end }}

    <p class="back-home"><a href="{{ "/" | relURL }}">&larr; Back to all games</a></p>
  </section>
{{- end -}}
