<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default site.Language.Lang | default "en" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  {{- partial "header.html" . -}}

  <main class="site-main {{ block "main_class" . }}{{ end }}">
    {{- block "main" . }}{{- end }}
  </main>

  {{- partial "footer.html" . -}}
  {{- block "scripts" . }}{{- end }}
</body>
</html>
