baseURL = "https://example.com/"
locale = "en-US"
title = "Lorum Ipsum"
theme = "lytestoa"

[params]
  subtitle = "Lorum Ipsum Games"
  description = "Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
  tagline = "Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
  logo = "logo.webp"
  og_image = "https://placehold.co/600x400"
  github_url = "https://github.com/"
  footer_text = "Lorem ipsum dolor sit amet, consectetur adipiscing elit."

[taxonomies]
  genre = "genres"
  tag = "tags"

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menus.main]]
    name = "Games"
    url = "/#games"
    weight = 20
  [[menus.main]]
    name = "About"
    url = "/#about"
    weight = 30
  [[menus.main]]
    name = "Github"
    url = "https://github.com/"
    weight = 40

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "content/games"
    target = "content/play"
  [[module.mounts]]
    source = "static"
    target = "static"

[[cascade]]
  [cascade.build]
    list = "never"
    render = "never"
  [cascade.target]
    path = "/play"
    kind = "section"

[[cascade]]
  [cascade.build]
    list = "never"
    render = "never"
  [cascade.target]
    path = "/play/game-*"

[[cascade]]
  [cascade.build]
    list = "never"
  [cascade.target]
    path = "/play/**"
